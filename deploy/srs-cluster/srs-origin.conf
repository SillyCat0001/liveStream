# SRS Origin Config
# 只接收推流，不对外服务
listen 1935;
server_id 1;

# 日志配置
log on;
log_level info;
log_container off;

# API 服务
api on;
api_port 1985;

# HTTP 服务器（用于 API 和控制）
http_server {
    enabled on;
    listen 8080;
    dir ./objs/nginx/html;
}

# Vhost 配置
vhost __defaultVhost__ {
    # 关闭边缘模式，作为纯源站
    mode ofl;

    # 计费和统计
    gop_cache off;
    queue_length 10;
    mr_enabled off;
    min_latency on;

    # HLS 配置
    hls on;
    hls_path ./objs/nginx/html/hls;
    hls_m3u8_file [stream].m3u8;
    hls_ts_file [stream]-[seq].ts;
    hls_fragment 2;
    hls_window 5;
    hls_cleanup on;
    hls_dispose 30;

    # HTTP-FLV 配置
    http_flv on;
    http_flv_path ./objs/nginx/html/[app]/[stream].flv;
}