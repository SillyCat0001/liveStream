# SRS Proxy Config
# 统一入口，转发推流和拉流
listen 1935;
server_id 2;

# HTTP API
http_api {
    enabled         on;
    listen          1986;
}

# HTTP 服务器
http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
}

# RTC 服务器（WebRTC）
rtc_server {
    enabled         on;
    listen          8000;
    candidate       192.168.1.3;
}

# Vhost 配置
vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    # 作为代理/转发器
    cluster {
        mode             ofl;
        origin           srs-origin:1935;
    }

    # HTTP-FLV 配置
    http_remux {
        enabled         on;
        mount           [vhost]/[app]/[stream].flv;
    }

    # WebRTC 配置
    rtc {
        enabled             on;
        rtmp_to_rtc         on;
        rtc_to_rtmp         off;
    }

    # 播放配置（低延迟）
    play {
        gop_cache       off;
        queue_length    1;
        mw_latency      100;
    }

    # 发布配置
    publish {
        mr              off;
    }
}