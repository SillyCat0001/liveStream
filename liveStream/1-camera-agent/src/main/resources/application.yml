server:
  port: 8080

camera:
  rtmp-url: rtmp://localhost/live
  server:
    websocket-url: ws://localhost:8080/ws
    reconnect-interval: 5000
    status-report-interval: 5000
    max-reconnect-attempts: 10
  stream-key: test-stream
  width: 1920
  height: 1080
  fps: 30
  video-bitrate: 2000
  audio-bitrate: 128
  codec: h264